services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    environment:
      POSTGRES_DB: mindbridge
      POSTGRES_USER: mindbridge
      POSTGRES_PASSWORD: ${MINDBRIDGE_POSTGRES_PASSWORD:-mindbridge}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindbridge -d mindbridge"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - mindbridge-postgres:/var/lib/postgresql/data

volumes:
  mindbridge-postgres:
