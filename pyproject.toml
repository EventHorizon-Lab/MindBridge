[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mindbridge"
version = "0.2.0"
description = "Fast local multimodal memory for Python agents"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "zvec>=0.7,<0.8",
]

[project.scripts]
mindbridge = "mindbridge.cli:main"
mindbridge-bench = "mindbridge.benchmarks.cli:main"
mindbridge-mcp = "mindbridge.cli:mcp"

[project.optional-dependencies]
local = [
    # Avoid transformers[audio]: pyctcdecode pins NumPy 1.x, which has no Python 3.13/3.14
    # wheels. Jina only needs librosa and soundfile for its native audio path.
    "librosa>=0.11,<2",
    "funasr>=1.4.4,<2",
    # NumPy 1.x has no wheels for the two newest supported interpreters.
    "numpy>=2,<3; python_version >= '3.13'",
    "sentence-transformers[image,video]>=5.7,<6",
    "soundfile>=0.13,<1",
]
vllm = [
    "vllm>=0.19.1,<1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "vllm>=0.19.1,<1; sys_platform == 'linux' and platform_machine == 'aarch64'",
]
server = [
    "fastapi>=0.116,<1",
    # 0.48 renamed the status constants the API layer uses (HTTP_413_CONTENT_TOO_LARGE,
    # HTTP_422_UNPROCESSABLE_CONTENT); an older resolution imports but cannot build the app.
    "starlette>=0.48,<2",
    "uvicorn>=0.35,<1",
]
mcp = [
    "mcp>=2,<3",
]

# Keep contributor-specific uv mirrors out of the shared lockfile.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "httpx2>=2.10,<3",
    "mypy>=1.15,<3",
    "packaging>=24,<27",
    # `faulthandler_exit_on_timeout` is read under `--strict-config`, which errors on an ini
    # key the installed pytest does not define, so the floor has to be a release that has it.
    "pytest>=9.1,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.11,<1",
    # tests/test_package.py reads this file; tomllib is 3.11+. mypy also requires the
    # backport on 3.10, which is why the tests passed before anything declared it.
    "tomli>=2,<3; python_version < '3.11'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mindbridge"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["ANN", "ASYNC", "B", "C4", "C90", "DTZ", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
# Every CI interpreter checks itself; Ruff enforces the Python 3.10 syntax floor.
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    # Installed and imported only on Python 3.10.
    "tomli",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
# Dump every thread and terminate if one test exceeds five minutes.
faulthandler_timeout = 300
faulthandler_exit_on_timeout = true
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: exercises optional external model services",
]
