[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mindbridge"
version = "0.2.0"
description = "Agentic native embodied omni-modal memory system"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "numpy>=2,<3",
    "opentelemetry-api>=1.34,<2",
    "pydantic>=2.10,<3",
    "zvec>=0.8,<0.9",
]

[project.scripts]
# Separate entry points keep product modules independent of benchmark code.
mindbridge = "mindbridge.cli:main"
mindbridge-bench = "mindbridge.benchmarks.cli:main"

[project.optional-dependencies]
# PEP 621 has no include syntax for optional groups; the package test keeps this equal to their
# union.
all = [
    "av>=14,<19",
    "cairosvg>=2.7,<3",
    "fastapi>=0.116,<1",
    "funasr @ git+https://github.com/modelscope/FunASR.git@940b0d2463141a2e9ace8a9fd965b4aea93f2db5",
    "httpx>=0.28,<1",
    "httpx2>=2.7,<3",
    "huggingface-hub>=0.30,<2",
    "librosa>=0.11,<2",
    "mcp>=2,<3",
    "nltk>=3.9,<4",
    "openai>=3,<4",
    "opencv-python-headless>=4.10,<6",
    "opentelemetry-sdk>=1.34,<2",
    "pillow>=10,<13",
    "pyproj>=3.6.1,<3.7; python_version < '3.11'",
    "pyproj>=3.7.2,<4; python_version >= '3.11'",
    "pyarrow>=18,<26",
    "pyyaml>=6,<7",
    "regex>=2024.11.6",
    "sentence-transformers[image,video]>=6.1,<7",
    "shapely>=2.1.2,<3",
    "soundfile>=0.13,<1",
    "starlette>=0.46,<2",
    "torch>=2.6,<3",
    "torchaudio>=2.11,<3",
    "torchvision>=0.26,<0.27",
    "tqdm>=4.66,<5",
    "transformers>=5.18,<6",
    "uvicorn>=0.35,<1",
]
benchmarks = [
    # download.py imports httpx at module scope; huggingface-hub happens to require it today.
    "httpx>=0.28,<1",
    "huggingface-hub>=0.30,<2",
    "nltk>=3.9,<4",
    "opentelemetry-sdk>=1.34,<2",
    "pyarrow>=18,<26",
    # eval.py reads its harness configuration file as YAML or JSON.
    "pyyaml>=6,<7",
    # Mem-Gallery's published normalizer uses regex Unicode word boundaries.
    "regex>=2024.11.6",
    # eval.py draws the per-task progress bar with it, and formats the non-interactive progress
    # line with `tqdm.format_meter` so both modes report the same counts and ETA.
    "tqdm>=4.66,<5",
]
observability = [
    "opentelemetry-sdk>=1.34,<2",
]
openai = [
    "av>=14,<19",
    "httpx2>=2.7,<3",
    "openai>=3,<4",
    "pillow>=10,<13",
]
face = [
    "opencv-python-headless>=4.10,<6",
]
gazetteer = [
    "pyproj>=3.6.1,<3.7; python_version < '3.11'",
    "pyproj>=3.7.2,<4; python_version >= '3.11'",
    "shapely>=2.1.2,<3",
]
local = [
    # The pinned Jina revision converts image/svg+xml through cairosvg, and memory.py maps .svg
    # to it, so a documented input needs it. LGPL-3.0, installed separately, never linked.
    "cairosvg>=2.7,<3",
    # Avoid transformers[audio]: pyctcdecode pins NumPy 1.x, which has no Python 3.13/3.14
    # wheels. Jina only needs librosa and soundfile for its native audio path.
    "librosa>=0.11,<2",
    "funasr @ git+https://github.com/modelscope/FunASR.git@940b0d2463141a2e9ace8a9fd965b4aea93f2db5",
    # EmbeddingGemma 2 requires ordered multimodal inputs introduced in ST 6.1.
    "sentence-transformers[image,video]>=6.1,<7",
    "soundfile>=0.13,<1",
    # FunASR imports torch at module scope and declares neither torch nor torchaudio, so both
    # arrive only because sentence-transformers happens to pull torch in.
    "torch>=2.6,<3",
    # Fun-ASR-Nano uses torchaudio.functional.forced_align for its native timestamps.
    "torchaudio>=2.11,<3",
    # sentence-transformers[image] imports torchvision; declaring it directly lets uv select the
    # matching CUDA build instead of mixing PyPI's default build with the pinned torch build.
    "torchvision>=0.26,<0.27",
    "transformers>=5.18,<6",
]
server = [
    "fastapi>=0.116,<1",
    "starlette>=0.46,<2",
    "uvicorn>=0.35,<1",
]
mcp = [
    "mcp>=2,<3",
]

[tool.uv]
required-version = ">=0.12.5"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# Keep contributor-specific uv mirrors out of the shared lockfile.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "httpx2>=2.10,<3",
    "mypy>=1.15,<3",
    "packaging>=24,<27",
    # `faulthandler_exit_on_timeout` is read under `--strict-config`, which errors on an ini
    # key the installed pytest does not define, so the floor has to be a release that has it.
    "pytest>=9.1,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.11,<1",
    # Packaging tests read pyproject.toml on Python 3.10, which has no tomllib.
    "tomli>=2,<3; python_version < '3.11'",
    # eval.py imports yaml and tqdm; neither ships inline types, so the strict gate needs stubs.
    "types-PyYAML>=6,<7",
    "types-tqdm>=4.66,<5",
]

[tool.hatch.build]
exclude = ["**/AGENTS.md", "**/CLAUDE.md", "/docs/research/**", "/research/**"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mindbridge"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["ANN", "ASYNC", "B", "C4", "C90", "DTZ", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
# Every CI interpreter checks itself; Ruff enforces the Python 3.10 syntax floor.
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    # Installed and imported only on Python 3.10.
    "tomli",
    # Optional benchmark download client, imported lazily.
    "huggingface_hub",
    "huggingface_hub.*",
    "shapely",
    "shapely.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
# Dump every thread and terminate if one test exceeds five minutes.
faulthandler_timeout = 300
faulthandler_exit_on_timeout = true
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: exercises optional external model services",
]
