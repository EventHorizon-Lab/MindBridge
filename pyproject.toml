[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mindbridge"
version = "0.2.0"
description = "Agentic native embodied omni-modal memory system"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "opentelemetry-api>=1.34,<2",
    "pydantic>=2.10,<3",
    "zvec>=0.7,<0.8",
]

[project.scripts]
# Two scripts, one documented CLI surface. `tests/test_package.py` fails a product module that
# names the benchmark package in any string constant, so a single dispatcher could not reach the
# benchmark family even through a lazy import. See docs/api/cli.md.
mindbridge = "mindbridge.cli:main"
mindbridge-bench = "mindbridge.benchmarks.cli:main"

[project.optional-dependencies]
# PEP 621 has no include syntax for optional groups; the package test keeps this equal to their
# union.
all = [
    "av>=14,<19",
    "cairosvg>=2.7,<3",
    "fastapi>=0.116,<1",
    "funasr>=1.4.6,<2",
    "httpx>=0.28,<1",
    "huggingface-hub>=0.30,<2",
    "librosa>=0.11,<2",
    "mcp>=2,<3",
    "nltk>=3.9,<4",
    "numpy>=2,<3; python_version >= '3.13'",
    "openai>=3,<4",
    "opencv-python-headless>=4.10,<6",
    "opentelemetry-sdk>=1.34,<2",
    "pillow>=10,<13",
    "pyarrow>=18,<26",
    "pyyaml>=6,<7",
    "sentence-transformers[image,video]>=5.7,<6",
    "soundfile>=0.13,<1",
    "starlette>=0.46,<2",
    "torch>=2.6,<3",
    "torchaudio>=2.11,<3",
    "uvicorn>=0.35,<1",
]
benchmarks = [
    # download.py imports httpx at module scope; huggingface-hub happens to require it today.
    "httpx>=0.28,<1",
    "huggingface-hub>=0.30,<2",
    "nltk>=3.9,<4",
    "opentelemetry-sdk>=1.34,<2",
    "pyarrow>=18,<26",
    # eval.py reads its harness configuration file as YAML, which also parses the JSON files the
    # flag used to take.
    "pyyaml>=6,<7",
]
observability = [
    "opentelemetry-sdk>=1.34,<2",
]
openai = [
    "av>=14,<19",
    "openai>=3,<4",
    "pillow>=10,<13",
]
face = [
    "opencv-python-headless>=4.10,<6",
]
local = [
    # The pinned Jina revision converts image/svg+xml through cairosvg, and memory.py maps .svg
    # to it, so a documented input needs it. LGPL-3.0, installed separately, never linked.
    "cairosvg>=2.7,<3",
    # Avoid transformers[audio]: pyctcdecode pins NumPy 1.x, which has no Python 3.13/3.14
    # wheels. Jina only needs librosa and soundfile for its native audio path.
    "librosa>=0.11,<2",
    "funasr>=1.4.6,<2",
    # NumPy 1.x has no wheels for the two newest supported interpreters.
    "numpy>=2,<3; python_version >= '3.13'",
    "sentence-transformers[image,video]>=5.7,<6",
    "soundfile>=0.13,<1",
    # FunASR imports torch at module scope and declares neither torch nor torchaudio, so both
    # arrive only because sentence-transformers happens to pull torch in.
    "torch>=2.6,<3",
    # Fun-ASR-Nano uses torchaudio.functional.forced_align for its native timestamps.
    "torchaudio>=2.11,<3",
]
server = [
    "fastapi>=0.116,<1",
    "starlette>=0.46,<2",
    "uvicorn>=0.35,<1",
]
mcp = [
    "mcp>=2,<3",
]

[tool.uv]
required-version = "==0.12.5"

# Keep contributor-specific uv mirrors out of the shared lockfile.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "httpx2>=2.10,<3",
    "mypy>=1.15,<3",
    "packaging>=24,<27",
    # `faulthandler_exit_on_timeout` is read under `--strict-config`, which errors on an ini
    # key the installed pytest does not define, so the floor has to be a release that has it.
    "pytest>=9.1,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.11,<1",
    # tests/test_package.py reads this file; tomllib is 3.11+. mypy also requires the
    # backport on 3.10, which is why the tests passed before anything declared it.
    "tomli>=2,<3; python_version < '3.11'",
    # eval.py imports yaml; PyYAML ships no inline types, so the strict gate needs the stubs.
    "types-PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mindbridge"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["ANN", "ASYNC", "B", "C4", "C90", "DTZ", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
# Every CI interpreter checks itself; Ruff enforces the Python 3.10 syntax floor.
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    # Installed and imported only on Python 3.10.
    "tomli",
    # Optional benchmark download client, imported lazily.
    "huggingface_hub",
    "huggingface_hub.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
# Dump every thread and terminate if one test exceeds five minutes.
faulthandler_timeout = 300
faulthandler_exit_on_timeout = true
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: exercises optional external model services",
]
