[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mindbridge"
version = "0.1.0"
description = "Agentic-native embodied memory as a service"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    # mindbridge.configuration reads mindbridge.toml, and every role imports it. tomllib is
    # 3.11+; the floor is 3.10 because JetPack, RDK, and RKNN edge images still ship it. This
    # is a runtime dependency, not the dev-group entry tests/test_package.py uses.
    "tomli>=2,<3; python_version < '3.11'",
]

[project.scripts]
mindbridge = "mindbridge.cli:main"
# The benchmark runners get their own binary: AGENTS.md keeps `benchmarks/` a leaf that no
# product module imports, so the product entry point cannot address them.
mindbridge-bench = "mindbridge.benchmarks.cli:main"
# The three names the README has always documented, kept as aliases. They route through
# mindbridge.cli so they report the same exit codes and one-line failures as the tree.
mindbridge-consolidate = "mindbridge.cli:consolidate"
mindbridge-lifecycle = "mindbridge.cli:lifecycle"
mindbridge-mcp = "mindbridge.cli:mcp"

[project.entry-points."mindbridge.generators"]
openai = "mindbridge.models.openai:create_generator"

[project.entry-points."mindbridge.embedders"]
jina = "mindbridge.models.jina:create_embedder"
openai = "mindbridge.models.openai:create_embedder"

[project.optional-dependencies]
benchmarks = [
    # The adapter benchmarks import mindbridge.models.jina, which reaches
    # mindbridge.telemetry. Without this the harness imports only next to some other extra
    # that happens to carry the API: `mindbridge-bench jina --help` raised ModuleNotFoundError
    # on a benchmarks-only install while `m3` ran, which is a scenario that cannot import its
    # own modules rather than a missing model dependency.
    "opentelemetry-api>=1.44,<2",
    "pyarrow>=18,<26",
    # benchmarks/releases.py downloads the Hub half of the official releases through
    # snapshot_download. Imported lazily, so a harness with the corpora already on disk still
    # runs without it; declared here because the import is this subtree's own.
    "huggingface-hub>=0.30,<2",
    # benchmarks/prepare.py stages the clips it cuts into the deployment's own bucket. Both are
    # lazy imports reached only when a task's prepared media has to be produced.
    "boto3>=1.40,<2",
    # It cuts them with mindbridge.media.clipping, the encoder the product stores evidence with,
    # rather than a second one that would drift from it.
    "mindbridge[media]",
]
edge = [
    "boto3>=1.40,<2",
    # boto3 pulls botocore, but edge/sync.py imports botocore.config and botocore.exceptions
    # by name, so the dependency is this package's, not a detail of boto3's own tree.
    "botocore>=1.40,<2",
    "cryptography>=45,<51",
    "opentelemetry-api>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-instrumentation-botocore>=0.65b0,<1",
    "opentelemetry-instrumentation-httpx>=0.65b0,<1",
    "opentelemetry-sdk>=1.44,<2",
    # identity_diarization.py imports NumPy directly, including on vendor-managed ARM images.
    "numpy>=1.26,<3",
    # Linux/Windows x86 and Apple Silicon get the portable identity runtime. Linux ARM devices
    # keep vendor wheels; PyTorch 2.13 no longer publishes Intel macOS wheels.
    "funasr>=1.3.19,<2; (sys_platform != 'darwin' and (platform_machine == 'x86_64' or platform_machine == 'AMD64')) or (sys_platform == 'darwin' and platform_machine == 'arm64')",
    "insightface>=1,<2; (sys_platform != 'darwin' and (platform_machine == 'x86_64' or platform_machine == 'AMD64')) or (sys_platform == 'darwin' and platform_machine == 'arm64')",
    "onnxruntime>=1.20,<2; (sys_platform != 'darwin' and (platform_machine == 'x86_64' or platform_machine == 'AMD64')) or (sys_platform == 'darwin' and platform_machine == 'arm64')",
    "opencv-python>=4.10,<6; (sys_platform != 'darwin' and (platform_machine == 'x86_64' or platform_machine == 'AMD64')) or (sys_platform == 'darwin' and platform_machine == 'arm64')",
    "torch==2.13.0; (sys_platform != 'darwin' and (platform_machine == 'x86_64' or platform_machine == 'AMD64')) or (sys_platform == 'darwin' and platform_machine == 'arm64')",
    # FunASR documents TorchAudio as part of its runtime but does not declare it itself.
    # TorchAudio 2.11 uses PyTorch's stable ABI and supports PyTorch 2.11 and newer.
    "torchaudio==2.11.0; (sys_platform != 'darwin' and (platform_machine == 'x86_64' or platform_machine == 'AMD64')) or (sys_platform == 'darwin' and platform_machine == 'arm64')",
]
server = [
    "boto3>=1.40,<2",
    "botocore>=1.40,<2",
    "celery[redis]>=5.6,<6",
    "fastapi>=0.116,<1",
    "mcp>=2,<3",
    # api/mcp.py imports the payload types straight from mcp_types. mcp brings it today; the
    # import is ours, so the requirement is declared here rather than inherited.
    "mcp-types>=2,<3",
    "openai>=2,<3",
    "opentelemetry-api>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-instrumentation-botocore>=0.65b0,<1",
    "opentelemetry-instrumentation-celery>=0.65b0,<1",
    "opentelemetry-instrumentation-fastapi>=0.65b0,<1",
    "opentelemetry-instrumentation-httpx>=0.65b0,<1",
    "opentelemetry-instrumentation-psycopg>=0.65b0,<1",
    "opentelemetry-sdk>=1.44,<2",
    "pgvector>=0.4,<1",
    "psycopg[binary,pool]>=3.2,<4",
    # FastAPI does not re-export starlette.types.Lifespan, so api/app.py imports it from
    # starlette itself. The floor is FastAPI's own; a tighter one downgrades the resolution
    # that FastAPI would otherwise pick, which is what naming a transitive dependency costs
    # when the range is guessed rather than read.
    "starlette>=0.46,<2",
    "uvicorn>=0.35,<1",
]
# The decoders mindbridge.media.clipping loads lazily. Separate from cloud-models so CI can
# install them without torch and actually run the clip tests.
media = [
    "av>=16,<17",
    "numpy>=1.26,<3",
    "pillow>=12,<13",
    "soundfile>=0.13,<1",
]
cloud-models = [
    "mindbridge[media]",
    # models/jina.py downloads the model snapshot through huggingface_hub.snapshot_download.
    "huggingface-hub>=0.30,<2",
    # Jina Omni loads file-backed audio through librosa. Without it the service starts and
    # embeds text/images/video, then fails only when the first audio evidence reaches it.
    "librosa>=0.11,<2",
    "opentelemetry-api>=1.44,<2",
    "sentence-transformers>=5.2,<6",
    "torch==2.13.0",
    # Jina Omni's image and video processor is a Qwen3-VL processor, and that one refuses to
    # construct without Torchvision. Its loader swallows the ImportError and leaves the
    # processor unset, so an install without this line embeds text and dies on the first
    # frame instead of failing where the dependency is missing.
    "torchvision==0.28.0",
    "transformers>=5.1,<6",
]
# One token for every scenario at once, for the workstation that plays all the roles and for
# installers with no `--all-extras` flag of their own. tests/test_package.py fails if this
# stops being the exact union, so a new extra cannot quietly stay out of it.
all = [
    "mindbridge[benchmarks,cloud-models,edge,media,server]",
]

# Declared so the lockfile resolves from PyPI whoever runs `uv lock`. Without it uv takes the
# default index from the machine's own uv.toml, and a contributor's local mirror ends up as the
# download URL for all 900-odd wheels that CI and every other checkout then install from.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.40,<2",
    # The quality matrix exercises edge modules without installing the multi-gigabyte model stack.
    "cryptography>=45,<51",
    "mypy>=1.15,<3",
    "packaging>=24,<27",
    # `faulthandler_exit_on_timeout` is read under `--strict-config`, which errors on an ini
    # key the installed pytest does not define, so the floor has to be a release that has it.
    "pytest>=9.1,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.11,<1",
    # tests/test_package.py reads this file; tomllib is 3.11+. mypy also requires the
    # backport on 3.10, which is why the tests passed before anything declared it.
    "tomli>=2,<3; python_version < '3.11'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mindbridge"]

[tool.ruff]
target-version = "py310"
line-length = 100
# Vendored from the Agent Memory Leaderboard at the revision pinned in
# benchmarks/aml/PINNED.md, which records the one deliberate local delta.
# Formatting it would add unrecorded deltas on top, and matching upstream's
# scoring logic is what makes our offline scores comparable to the published ones.
exclude = ["benchmarks/aml"]

[tool.ruff.lint]
select = ["ANN", "ASYNC", "B", "C4", "C90", "DTZ", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
# Deliberately not pinned to the 3.10 floor. Every leg of the CI matrix runs mypy, so each
# one checks itself, and `ruff`'s own `target-version = "py310"` is what holds the whole tree
# to syntax the floor can parse. A `python_version` pin below the interpreter also makes mypy
# refuse stubs that are newer than it: numpy 2.5 (`Requires-Python >=3.12`) writes PEP 695
# `type` aliases, and reading them as 3.10 ended the run before any of this package's own
# code was checked.
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    "celery",
    "celery.*",
    # The media decoders live in the cloud-models extra, which CI does not install because
    # it also carries torch. mindbridge.media.clipping imports them lazily and raises
    # ModelUnavailableError without them; its tests skip rather than fail collection.
    "av",
    "av.*",
    # Same shape one extra over: the quality matrix installs `media` and `server`, not
    # `benchmarks`, so the Hub client benchmarks/releases.py downloads releases with is absent
    # while every leg still type-checks the module that imports it.
    "huggingface_hub",
    "numpy",
    "PIL",
    "PIL.*",
    "soundfile",
    # Read by tests/test_package.py on 3.10 only, where the backport is installed. mypy now
    # checks as the interpreter it runs on, so every other leg reads the `tomllib` branch and
    # leaves this import unresolved.
    "tomli",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
asyncio_mode = "auto"
# A hung run costs a CI slot until something external notices and leaves nothing behind to
# diagnose. These two are pytest's own answer and need no conftest: the plugin arms
# `faulthandler.dump_traceback_later` per test with `file=` bound to a stderr it dup'd before
# capture redirected fd 2, so the dump actually reaches the operator, and it re-arms in
# `pytest_runtest_protocol`, so it survives the unconditional `cancel_dump_traceback_later()`
# that its own `pytest_exception_interact` hook runs after any failure.
#
# `faulthandler_exit_on_timeout` is the load-bearing half. It defaults to false, which is why
# `faulthandler_timeout` alone looks like it "did not fire": it dumps and lets the run continue
# to hang. Both are required for a hang to end the process non-zero.
#
# The budget is per test, not per session, so it can sit far below a session ceiling: the whole
# unit suite is ~12s and CI's slowest leg is under two minutes.
faulthandler_timeout = 300
faulthandler_exit_on_timeout = true
markers = [
    "integration: requires an external PostgreSQL test database",
]
