# MindBridge's non-secret configuration. This file is committed; credentials are not in it.
#
# Every key here is overridden by its environment variable, so a container or a CI job can
# change one value without rebuilding anything. `mindbridge config check --role <role>` reports
# which source won for each setting. Credentials live in the environment only -- see
# .env.example -- and this file is refused at load time if it carries one.

# Cosine floor applied to retrieved evidence. 0.0 keeps everything the index returns.
minimum_embedding_similarity = 0.0

[database]
max_pool_size = 32

[object_storage]
bucket = "mindbridge-media"
# Unset for AWS S3, which needs no endpoint. MinIO and other S3-compatible stores need one.
endpoint_url = "http://localhost:9000"

# One search space and one vector width shared by the index and every encoder. Both encoder
# sections below inherit these two keys, so the deployment states them once.
[embedding]
dimension = 1024
space_id = "jinaai/jina-embeddings-v5-omni-small-retrieval-1024"

[generator]
plugin = "openai"
endpoint = "http://localhost:8001/v1"
model_id = "qwen3.8-max"
# The Worker sizes its Celery budget from this, so the two have to agree. A perception clip can
# take 16-25 minutes, which is why the default is not a web timeout.
request_timeout_seconds = 1800

[embedder]
plugin = "openai"
endpoint = "http://localhost:8002/v1"
model_id = "jinaai/jina-embeddings-v5-omni-small-retrieval"

# The Worker's image, video, and audio encoder. `openai` points it at the embedder endpoint
# already configured above, which encodes media as well as text -- no second model and no GPU.
# `jina` loads the model in-process instead: it needs --extra cloud-models, a model_id that is
# a Hugging Face repository ID, and 3.7 GiB of VRAM in *every* prefork child.
[media_embedder]
plugin = "openai"

# How many jobs one Worker process runs at once, and how much device memory this deployment
# lets resident encoders occupy. Both are commented out because the shipped defaults -- one job
# per process, one model copy of headroom -- are the safe ones, and raising either is a
# deployment's decision. A served media slot is network-bound, so 8 is a reasonable start; the
# Worker refuses to start when a pool that wide would exceed the budget while an encoder slot
# names an in-process plugin.
[worker]
# concurrency = 8
# vram_budget_gib = 48

# Unset `level` is INFO; unset `format` gets the readable form on a terminal and the parseable
# one in a pipe.
[log]
# level = "INFO"
# format = "json"
