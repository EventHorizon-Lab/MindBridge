name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      MINDBRIDGE_TEST_DATABASE_URL: postgresql://mindbridge:mindbridge_test@localhost:5432/mindbridge_test
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18-trixie
        env:
          POSTGRES_DB: mindbridge_test
          POSTGRES_USER: mindbridge
          POSTGRES_PASSWORD: mindbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mindbridge -d mindbridge_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type check
        run: uv run --frozen mypy

      - name: Test
        run: uv run --frozen pytest -W error

      - name: Check whitespace
        run: git diff --check
