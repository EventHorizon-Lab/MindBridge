name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installability:
    name: Install ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base
            requirement: .
            probe: >-
              mindbridge
              mindbridge.cli
              mindbridge.benchmarks
              mindbridge.benchmarks.isolation
              mindbridge.benchmarks.local_index_benchmark
              mindbridge.config
              mindbridge.exceptions
              mindbridge.infrastructure.local
              mindbridge.memory
              mindbridge.models.openai_http
              mindbridge.sdk
              mindbridge.types
          - name: server
            requirement: .[server]
            probe: >-
              mindbridge.api
              mindbridge.api.app
              mindbridge.api.auth
              mindbridge.api.errors
              mindbridge.server
          - name: local
            requirement: .[local]
            probe: >-
              mindbridge.models.jina
              mindbridge.models.sentence_transformers
          - name: mcp
            requirement: .[mcp]
            probe: mindbridge.api.mcp
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install isolated package
        run: |
          uv venv .install-venv
          uv pip install --python .install-venv/bin/python --strict '${{ matrix.requirement }}'

      - name: Import supported modules
        env:
          PROBE: ${{ matrix.probe }}
        run: |
          .install-venv/bin/python -I - <<'PY'
          import importlib
          import os

          modules = os.environ["PROBE"].split()
          for module in modules:
              importlib.import_module(module)
          print(f"imported {len(modules)} supported modules")
          PY

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0
        with:
          globs: |
            **/*.md
            !.git/**
            !.venv/**
            !.pytest_cache/**
            !.benchmarks/**

      - name: Check documentation links
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: >-
            --no-progress
            --root-dir "${{ github.workspace }}"
            './*.md'
            './docs/**/*.md'
            './.github/**/*.md'
          fail: true
          failIfEmpty: true

  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups --all-extras

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type check
        run: uv run --frozen mypy

      - name: Test
        run: uv run --frozen pytest -W error

      - name: Check whitespace
        run: git diff --check
